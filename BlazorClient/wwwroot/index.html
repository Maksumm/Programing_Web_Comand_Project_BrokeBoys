<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlazorClient</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="BlazorClient.styles.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

    <script>
        // Якщо сторінка перезавантажується через зміну мови, ховаємо напис і смугу
        if (sessionStorage.getItem("lang_switch")) {
            document.documentElement.classList.add("lang-switch");
            sessionStorage.removeItem("lang_switch");
        }
    </script>

    <style>
        html, body {
            margin: 0;
            background: #E9EBE8;
        }

        .app-loader {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            font-family: 'Roboto', sans-serif;
        }

        .app-loader__dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #1E3A2B;
        }

        .app-loader__title {
            font-size: 22px;
            font-weight: 700;
            color: #1E3A2B;
        }

        .app-loader__bar {
            width: 160px;
            height: 4px;
            background: #C8D6CE;
            border-radius: 2px;
            overflow: hidden;
        }

            .app-loader__bar span {
                display: block;
                width: 40%;
                height: 100%;
                background: #1E3A2B;
                border-radius: 2px;
                animation: loader-move 1.1s ease-in-out infinite;
            }

        @keyframes loader-move {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(350%);
            }
        }

        .lang-switch .app-loader__title,
        .lang-switch .app-loader__bar {
            visibility: hidden;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="app-loader">
            <div class="app-loader__dot"></div>
            <div class="app-loader__title">SeasonalPrices</div>
            <div class="app-loader__bar"><span></span></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
